[package]
name = "policy"
version = "0.1.0"
edition = "2021"
authors = ["near-intent-one"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", default-features = true }
serde_json = "1"
hex = "0.4"
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
# Use unwind so require!/panic messages surface in receipts (better demos/evidence).
panic = "unwind"
overflow-checks = true
